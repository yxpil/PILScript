name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build demo_lib for FFI tests
        run: cargo build --release --all-targets --locked

      - name: Test
        run: cargo test --release --locked

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p pilscript

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/pilscript"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          PKG="PILScript-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$PKG"
          cp "$BIN" "dist/$PKG/"
          cp README.md LICENSE "dist/$PKG/"
          cp -r examples "dist/$PKG/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "$PKG.zip" "./$PKG/*" >/dev/null
          else
            tar -czf "$PKG.tar.gz" "$PKG"
          fi
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  publish:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## PILScript ${{ github.ref_name }}

            单文件解释器 + 示例脚本。下载对应平台压缩包，解压后运行 `pilscript`。

            | 平台 | 文件 |
            |---|---|
            | Windows x64 | `PILScript-*-x86_64-pc-windows-msvc.zip` |
            | Linux x64 | `PILScript-*-x86_64-unknown-linux-gnu.tar.gz` |
            | macOS Apple Silicon | `PILScript-*-aarch64-apple-darwin.tar.gz` |

            同页附 `SHA256SUMS.txt` 供校验。
